name: ${COMPOSE_PROJECT_NAME:-index-trial}
x-app: &app
  build: ./backend
  environment:
    DATABASE_URL: mysql+pymysql://trial:trialpass@db:3306/indextrial
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-index-trial-local-demo-secret-change-before-use}
    SEED_DEMO: ${SEED_DEMO:-true}
  volumes:
    - artifacts:/artifacts
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-index-trial}-db
    environment: {MYSQL_DATABASE: indextrial, MYSQL_USER: trial, MYSQL_PASSWORD: trialpass, MYSQL_ROOT_PASSWORD: rootlocalpass}
    ports: ["${DB_PORT:-17741}:3306"]
    volumes: ["dbdata:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 4s
      retries: 35
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-index-trial}-redis
    command: [redis-server, --appendonly, 'yes']
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-index-trial}-backend
    ports: ["${BACKEND_PORT:-19241}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
  worker:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-index-trial}-worker
    command: ["python", "-m", "src.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/worker-heartbeat').st_mtime<60"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-index-trial}-frontend
    ports: ["${FRONTEND_PORT:-18241}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  dbdata:
  redisdata:
  artifacts:
